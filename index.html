<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Rebound Compiler</title>
        <meta charset="UTF-8" />
        <meta viewport="width=device-width, initial-scale=1.0" />
    </head>
    <body>
        <header><h1>Rebound Compiler</h1></header>
        <section class="compiler">
            <label>Drag and drop file here: </label>
            <input type="file" accept=".rbnd" />
            <br>
            <button id="execute">Run</run>
            <br>
            <label>Output: </label>
            <div id="outputBox"></div>
        </section>
    </body>
    <script src="./js/interpreter.js"></script>
</html>
